[bootstrap.apt.sources.crowdsec]
uris = "https://packagecloud.io/crowdsec/crowdsec/any/"
suites = "any"
components = "main"
key = "https://packagecloud.io/crowdsec/crowdsec/gpgkey"
fingerprint = "6A89E3C2303A901A889971D3376ED5326E93CD0C"

[bootstrap.apt.sources.tailscale]
uris = "https://pkgs.tailscale.com/stable/debian"
suites = "trixie"
components = "main"
key = "https://pkgs.tailscale.com/stable/debian/trixie.noarmor.gpg"
fingerprint = "2596A99EAAB33821893C0A79458CA832957F5868"

[bootstrap.packages]
"apt:git" = "latest"
"apt:curl" = "latest"
"apt:zsh" = "latest"
"apt:podman" = "latest"
"apt:qemu-system-x86" = "latest"
"apt:virtiofsd" = "latest"
"apt:crowdsec" = "latest"
"apt:crowdsec-firewall-bouncer-iptables" = "latest"
"apt:tailscale" = "latest"
"apt:docker.io" = "latest"
"apt:docker-cli" = "latest"
"apt:docker-compose" = "latest"

[bootstrap.services.crowdsec]
state = "running"
enabled = true

[bootstrap.services.crowdsec-firewall-bouncer]
state = "running"
enabled = true

[bootstrap.services.tailscaled]
state = "running"
enabled = true

[bootstrap.services.docker]
state = "running"
enabled = true

# Runs Coolify. No password is set, so it can only be reached with
# `sudo -iu coolify` from root. Docker group membership is effectively root.
[bootstrap.groups.coolify]

[bootstrap.groups.docker]
system = true

[bootstrap.users.coolify]
group = "coolify"
groups = ["docker"]
home = "/home/coolify"
shell = "/bin/bash"
create_home = true
comment = "Coolify"

[tasks.bootstrap]
description = "Root shell, then global Bun, Claude Code, hcloud and ripgrep"
run = [
  "usermod -s /usr/bin/zsh root",
  "sshd -t && systemctl reload ssh",
  '"$HOME/.local/bin/mise" use -g bun@latest claude@latest hcloud@latest ripgrep@latest',
]

[tasks.setup-tailscale]
description = "Join the tailnet (prints a login link to approve in a browser)"
run = "tailscale up --hostname=koala"

[tasks.setup-machine]
description = "Enroll CrowdSec in the console (opens an approval link)"
run = "cscli console enroll --quick"

[bootstrap.repos]
"~/.oh-my-zsh" = { url = "https://github.com/ohmyzsh/ohmyzsh.git", depth = 1 }

[bootstrap.files."~/.zshrc"]
content = """
export PATH="$HOME/.local/bin:$PATH"
eval "$(mise activate zsh)"
export ZSH="$HOME/.oh-my-zsh"
ZSH_THEME="robbyrussell"
plugins=(git)
source $ZSH/oh-my-zsh.sh
"""

[bootstrap.files."/etc/motd"]
state = "absent"

[bootstrap.files."/etc/update-motd.d/10-uname"]
mode = "0644"

[bootstrap.files."/etc/update-motd.d/10-koala"]
source = "./files/10-koala"
mode = "0755"

[bootstrap.files."/etc/ssh/sshd_config.d/10-koala.conf"]
content = """
PrintLastLog no
"""
